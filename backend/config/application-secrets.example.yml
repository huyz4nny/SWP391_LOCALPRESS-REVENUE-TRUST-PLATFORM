# Copy file này thành application-secrets.yml (cùng thư mục) rồi điền giá trị thật.
# application-secrets.yml đã nằm trong .gitignore, KHÔNG commit.
localpress:
  sepay:
    merchant-id: "<SePay merchant id>"
    secret-key: "<SePay PG secret key>"
    env: sandbox            # sandbox | production
    bank-code: VCB
    bank-short-name: vietcombank
    account-number: "<số tài khoản nhận tiền>"
    account-name: "<TÊN CHỦ TÀI KHOẢN>"
    webhook-api-key: "<API key nhập ở mục Webhook trên dashboard SePay>"
    # Token API: my.sepay.vn > Cấu hình công ty > API Access > + Thêm API. Dùng cho nút "Đồng bộ từ SePay"
    # và "Tôi đã chuyển khoản, kiểm tra lại" khi máy local không nhận được webhook.
    api-token: "<SePay API token>"
