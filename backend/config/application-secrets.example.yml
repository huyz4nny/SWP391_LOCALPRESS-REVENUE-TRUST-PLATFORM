# Copy file này thành application-secrets.yml (cùng thư mục) rồi điền giá trị thật.
# application-secrets.yml đã nằm trong .gitignore, KHÔNG commit.
localpress:
  ai:
    api-key: CHANGE_ME
  sepay:
    bank-code: VCB
    bank-short-name: vietcombank
    account-number: "<số tài khoản nhận tiền>"
    account-name: "<TÊN CHỦ TÀI KHOẢN>"
    webhook-api-key: "<API key nhập ở mục Webhook trên dashboard SePay>"
    # Token API: my.sepay.vn > Cấu hình công ty > API Access > + Thêm API. Dùng cho nút "Đồng bộ từ SePay"
    # và "Tôi đã chuyển khoản, kiểm tra lại" khi máy local không nhận được webhook.
    api-token: "<SePay API token>"
  payment:
    # Chỉ bật khi chạy script E2E của SV4 (tạo đơn thử trực tiếp). Mặc định false: trình duyệt không được tự tạo đơn (Rule 4).
    client-orders-enabled: false
  # Email (SV3: báo kết quả hoàn tiền cho độc giả). Bỏ trống phần spring.mail bên dưới thì app vẫn chạy, chỉ không gửi mail.
  mail:
    from-name: LocalPress
    # Chỉ dùng khi demo: mọi email được chuyển về địa chỉ này (tiêu đề ghi người nhận gốc). Xóa dòng để gửi đúng người.
    redirect-to: "<email của bạn>"

# Gmail: dùng Gmail cá nhân, bật Xác minh 2 bước, tạo "Mật khẩu ứng dụng" (16 ký tự) rồi dán vào password.
spring:
  mail:
    host: smtp.gmail.com
    port: 587
    username: "<gmail-cua-ban@gmail.com>"
    password: "<mật khẩu ứng dụng 16 ký tự>"
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
