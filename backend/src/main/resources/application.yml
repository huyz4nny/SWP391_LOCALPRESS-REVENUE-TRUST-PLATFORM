spring:
  application:
    name: localpress-backend
  profiles:
    active: dev
  mvc:
    format:
      date-time: iso

server:
  port: 8080
  servlet:
    context-path: /

localpress:
  google:
    client-id: ${GOOGLE_CLIENT_ID:847537323970-evboogid431elvcatmp52ii98jtec0ke.apps.googleusercontent.com}
  jwt:
    # Empty in local development: generate an ephemeral key at startup.
    # Deployment must supply a random secret of at least 32 UTF-8 bytes.
    secret: ${LOCALPRESS_JWT_SECRET:}
    expiration-ms: ${LOCALPRESS_JWT_EXPIRATION_MS:3600000}
