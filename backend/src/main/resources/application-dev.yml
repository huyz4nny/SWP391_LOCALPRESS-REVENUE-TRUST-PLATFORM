spring:
  config:
    # CWD = backend/ (Maven) hoặc thư mục gốc repo (IntelliJ). optional nên thiếu file không làm chết Spring.
    import:
      - optional:file:./config/application-secrets.yml
      - optional:file:./backend/config/application-secrets.yml
  datasource:
    url: jdbc:mysql://localhost:3306/localpress_db?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

logging:
  level:
    com.localpress: DEBUG
    org.springframework.security: INFO

localpress:
  jwt:
    # Public development key only. Never use this default outside the dev profile.
    secret: ${LOCALPRESS_JWT_SECRET:localpress-dev-only-signing-key-change-before-deploy-2026}
  storage:
    image-directory: "${user.home}/localpress-data/uploads"
  # SePay: không gán secret-key rỗng ở đây — Spring sẽ đè file secrets và HMAC checkout crash.
  # Khóa nằm ở backend/config/application-secrets.yml (gitignore) hoặc biến SEPAY_*.
  # Mẫu: backend/config/application-secrets.example.yml
  payment:
    order-ttl-minutes: 15
    topup-min-amount: 10000
    topup-max-amount: 50000000

