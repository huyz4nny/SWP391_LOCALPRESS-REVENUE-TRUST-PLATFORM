<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/newspaper.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LocalPress — Nền tảng Báo điện tử & Doanh thu Địa phương</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,400&display=swap" rel="stylesheet">
    <script>
      // Gắn class dark trước khi vẽ trang để không nháy trắng (xem src/components/shared/ThemeToggle.tsx)
      try {
        var t = localStorage.getItem('localpress-theme')
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-[#fafaf9] antialiased text-[#141516]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
