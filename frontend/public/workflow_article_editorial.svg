<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 560" width="1060" height="560" style="background:#ffffff; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Marker arrow for lines -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000" />
    </marker>
  </defs>

  <!-- Title & Subtitle Header -->
  <text x="530" y="30" font-size="16" font-weight="900" text-anchor="middle" letter-spacing="0.5">FLOW 2.1 — EDITORIAL ARTICLE REVIEW &amp; FOUR-EYES PUBLICATION WORKFLOW</text>
  <text x="530" y="47" font-size="11" font-weight="normal" fill="#475569" text-anchor="middle">Draft submission • Maker-Checker review • Feedback cycle • Editorial publication</text>

  <!-- Outer Frame -->
  <rect x="20" y="58" width="1020" height="480" fill="none" stroke="#000000" stroke-width="1.8" />

  <!-- Horizontal Swimlane Dividers (3 Lanes: Author, Editor, System Platform) -->
  <line x1="20" y1="195" x2="1040" y2="195" stroke="#000000" stroke-width="1.2" />
  <line x1="20" y1="405" x2="1040" y2="405" stroke="#000000" stroke-width="1.2" />

  <!-- Vertical Lane Header Divider -->
  <line x1="85" y1="58" x2="85" y2="538" stroke="#000000" stroke-width="1.2" />

  <!-- Swimlane Left Headers (Vertical Text) -->
  <g font-size="12" font-weight="bold" fill="#000000" text-anchor="middle" letter-spacing="1">
    <text x="52" y="128" transform="rotate(-90 52 128)">AUTHOR</text>
    <text x="52" y="300" transform="rotate(-90 52 300)">EDITOR</text>
    <text x="52" y="472" transform="rotate(-90 52 472)">SYSTEM PLATFORM</text>
  </g>

  <!-- ====================================================================== -->
  <!-- LANE 1: AUTHOR (y: 58 - 195) - DRAFT & SUBMIT ONLY -->
  <!-- ====================================================================== -->

  <!-- Start Node (Author) -->
  <circle cx="115" cy="128" r="9" fill="#000000" />
  <line x1="124" y1="128" x2="148" y2="128" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />

  <!-- Box A1: Create / edit draft -->
  <rect x="150" y="105" width="115" height="46" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="207" y="125" font-size="10" font-weight="bold" text-anchor="middle">Create / edit draft</text>
  <text x="207" y="139" font-size="9" text-anchor="middle">(title, content, tags)</text>

  <line x1="265" y1="128" x2="293" y2="128" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />

  <!-- Box A2: Set category, tags, slug -->
  <rect x="295" y="105" width="135" height="46" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="362" y="125" font-size="10" text-anchor="middle">Set category, slug,</text>
  <text x="362" y="139" font-size="9" text-anchor="middle">manage cover image</text>

  <line x1="430" y1="128" x2="458" y2="128" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />

  <!-- Box A3: Propose Free / Premium -->
  <rect x="460" y="105" width="135" height="46" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="527" y="125" font-size="10" text-anchor="middle">Propose Free / Premium</text>
  <text x="527" y="139" font-size="9" text-anchor="middle">access &amp; single price</text>

  <line x1="595" y1="128" x2="628" y2="128" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />

  <!-- Box A4: Save draft & submit to Editorial -->
  <rect x="630" y="105" width="145" height="46" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="702" y="125" font-size="10" font-weight="bold" text-anchor="middle">Preview &amp; submit</text>
  <text x="702" y="139" font-size="9" text-anchor="middle">to Editorial (SUBMITTED)</text>

  <!-- Arrow A4 down to System Platform Box S1 -->
  <line x1="702" y1="151" x2="702" y2="438" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />

  <!-- Box A5: Read feedback & revise -->
  <rect x="835" y="105" width="145" height="46" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="907" y="125" font-size="10" text-anchor="middle">Read feedback notes;</text>
  <text x="907" y="139" font-size="9" text-anchor="middle">revise new draft (v+1)</text>

  <!-- Loop back from A5 -> A1 -->
  <polyline points="907,105 907,76 207,76 207,103" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />

  <!-- ====================================================================== -->
  <!-- LANE 2: EDITOR (y: 195 - 405) - EDITORIAL REVIEW & PUBLISH -->
  <!-- ====================================================================== -->

  <!-- Box E1: Review Queue Entry -->
  <rect x="190" y="235" width="135" height="48" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="257" y="256" font-size="10" font-weight="bold" text-anchor="middle">Open review queue</text>
  <text x="257" y="270" font-size="9" text-anchor="middle">(ArticleListPage.tsx)</text>

  <line x1="325" y1="259" x2="358" y2="259" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />

  <!-- Decision Diamond D1: Self Article? (Four-Eyes Principle Gate) -->
  <polygon points="395,234 435,259 395,284 355,259" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="395" y="257" font-size="9" font-weight="bold" text-anchor="middle">Self</text>
  <text x="395" y="268" font-size="9" font-weight="bold" text-anchor="middle">Article?</text>

  <!-- Branch D1: Yes (Author == Current Editor) -> Enforce Four-Eyes -->
  <line x1="395" y1="284" x2="395" y2="328" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
  <text x="403" y="305" font-size="9" font-weight="bold" fill="#b45309">Yes</text>

  <!-- Box E2: Four-Eyes Lock -->
  <rect x="315" y="330" width="160" height="52" fill="#fffbeb" stroke="#d97706" stroke-width="1.3" />
  <text x="395" y="349" font-size="9" font-weight="bold" fill="#92400e" text-anchor="middle">Four-Eyes Principle (Maker):</text>
  <text x="395" y="362" font-size="8.5" fill="#92400e" text-anchor="middle">Lock approval (403 Forbidden);</text>
  <text x="395" y="374" font-size="8.5" fill="#92400e" text-anchor="middle">Show "Pending other Editor review"</text>

  <!-- Branch D1: No (Independent Editor) -> Proceed Review -->
  <line x1="435" y1="259" x2="498" y2="259" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
  <text x="460" y="250" font-size="9" font-weight="bold" fill="#15803d">No (Checker)</text>

  <!-- Box E3: Independent Review -->
  <rect x="500" y="235" width="145" height="48" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="572" y="255" font-size="10" text-anchor="middle">Editorial evaluation:</text>
  <text x="572" y="269" font-size="8.5" text-anchor="middle">quality, ethics, pricing</text>

  <line x1="645" y1="259" x2="683" y2="259" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />

  <!-- Decision Diamond D2: Approved? -->
  <polygon points="715,234 755,259 715,284 675,259" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="715" y="262" font-size="9" font-weight="bold" text-anchor="middle">Approved?</text>

  <!-- Branch D2: No (Reject / Request fixes) -->
  <line x1="715" y1="284" x2="715" y2="328" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
  <text x="723" y="305" font-size="9" font-weight="bold" fill="#b91c1c">No</text>

  <!-- Box E4: Record feedback notes -->
  <rect x="645" y="330" width="140" height="52" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="715" y="349" font-size="9" font-weight="bold" text-anchor="middle">Enter review notes;</text>
  <text x="715" y="362" font-size="8.5" text-anchor="middle">set CHANGES_REQUESTED</text>
  <text x="715" y="374" font-size="8" text-anchor="middle">(review_feedback column)</text>

  <!-- Arrow from E4 up to Author A5 -->
  <polyline points="785,356 907,356 907,153" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />

  <!-- Branch D2: Yes (Pass review) -->
  <line x1="755" y1="259" x2="798" y2="259" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
  <text x="772" y="250" font-size="9" font-weight="bold" fill="#15803d">Yes</text>

  <!-- Box E5: Approve Version -->
  <rect x="800" y="235" width="100" height="48" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="850" y="255" font-size="10" font-weight="bold" text-anchor="middle">Approve version</text>
  <text x="850" y="269" font-size="9" text-anchor="middle">(APPROVED)</text>

  <!-- Line from E5 to Box E6: Publish Article -->
  <line x1="900" y1="259" x2="928" y2="259" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />

  <!-- Box E6: Publish Article -->
  <rect x="930" y="235" width="100" height="48" fill="#ecfdf5" stroke="#059669" stroke-width="1.3" />
  <text x="980" y="254" font-size="9.5" font-weight="bold" fill="#065f46" text-anchor="middle">Editor triggers:</text>
  <text x="980" y="267" font-size="9.5" font-weight="bold" fill="#065f46" text-anchor="middle">"Publish now"</text>
  <text x="980" y="278" font-size="8" fill="#047857" text-anchor="middle">(status = PUBLISHED)</text>

  <!-- Arrow E6 down to System S2 -->
  <line x1="980" y1="283" x2="980" y2="438" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />

  <!-- ====================================================================== -->
  <!-- LANE 3: SYSTEM PLATFORM (y: 405 - 538)                                 -->
  <!-- ====================================================================== -->

  <!-- Box S1: Validate and Queue -->
  <rect x="625" y="440" width="155" height="52" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="702" y="459" font-size="9" text-anchor="middle">Validate author &amp; slug;</text>
  <text x="702" y="472" font-size="8.5" text-anchor="middle">Store articles &amp; version v1;</text>
  <text x="702" y="483" font-size="8.5" text-anchor="middle">Set status = SUBMITTED</text>

  <!-- Arrow S1 -> E1 (Queue -> Editor review) -->
  <polyline points="625,466 257,466 257,285" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />

  <!-- Box S2: Publish Execution -->
  <rect x="910" y="440" width="125" height="52" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="972" y="459" font-size="9.5" font-weight="bold" text-anchor="middle">Set PUBLISHED;</text>
  <text x="972" y="472" font-size="8.5" text-anchor="middle">generate unique slug;</text>
  <text x="972" y="483" font-size="8.5" text-anchor="middle">live on news portal</text>

  <!-- Bullseye End Node for Publishing (LIFECYCLE COMPLETED) -->
  <circle cx="972" cy="518" r="9" fill="none" stroke="#000000" stroke-width="1.5" />
  <circle cx="972" cy="518" r="4.5" fill="#000000" />
  <line x1="972" y1="492" x2="972" y2="507" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />

</svg>
