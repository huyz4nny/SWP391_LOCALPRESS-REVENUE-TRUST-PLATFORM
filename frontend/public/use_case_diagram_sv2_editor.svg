  <text x="550" y="1031" font-size="9.5" font-weight="bold" fill="#0284c7" text-anchor="middle">UC024</text>

  <!-- ====================================================================== -->
  <!-- <<include>> RELATIONSHIPS (Matching sample image dashed arrows)         -->
  <!-- ====================================================================== -->
  <!-- UC021 (Approve/Reject) includes UC020 (Review Specs) -->
  <line x1="660" y1="788" x2="660" y2="766" stroke="#0f172a" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#uc-arrow)" />
  <text x="666" y="780" font-size="8.5" font-style="italic" fill="#0f172a">«include»</text>

  <!-- UC016 (Process Booking) includes UC017 (Slot Inventory Calendar) -->
  <line x1="440" y1="482" x2="440" y2="504" stroke="#0f172a" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#uc-arrow)" />
  <text x="446" y="497" font-size="8.5" font-style="italic" fill="#0f172a">«include»</text>

