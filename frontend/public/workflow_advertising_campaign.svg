<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 620" width="1020" height="620" style="background:#ffffff; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000" />
    </marker>
  </defs>

  <!-- Outer frame -->
  <rect x="20" y="20" width="980" height="580" fill="none" stroke="#000000" stroke-width="2" />

  <!-- Horizontal Swimlane dividers -->
  <line x1="20" y1="180" x2="1000" y2="180" stroke="#000000" stroke-width="1.5" />
  <line x1="20" y1="410" x2="1000" y2="410" stroke="#000000" stroke-width="1.5" />

  <!-- Vertical Lane divider for titles -->
  <line x1="80" y1="20" x2="80" y2="600" stroke="#000000" stroke-width="1.5" />

  <!-- Swimlane Headers -->
  <g font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">
    <text x="50" y="100" transform="rotate(-90 50 100)">Advertiser</text>
    <text x="50" y="295" transform="rotate(-90 50 295)">Reviewer / Staff</text>
    <text x="50" y="505" transform="rotate(-90 50 505)">System / Platform</text>
  </g>

  <!-- ========================================== -->
  <!-- LANE 1: ADVERTISER                         -->
  <!-- ========================================== -->
  <!-- Start Node -->
  <circle cx="115" cy="100" r="13" fill="#000000" />
  <line x1="128" y1="100" x2="155" y2="100" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow2)" />

  <!-- Box 1: Create Booking Request -->
  <rect x="155" y="70" width="165" height="60" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
  <text x="237" y="93" font-size="11" font-weight="bold" text-anchor="middle">Create Booking Request</text>
  <text x="237" y="108" font-size="10" text-anchor="middle">(campaignName, slotId,</text>
  <text x="237" y="121" font-size="10" text-anchor="middle">startDate, endDate, contact)</text>

  <!-- Arrow Box 1 -> Box 2 -->
  <line x1="320" y1="100" x2="350" y2="100" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow2)" />

  <!-- Box 2: Submit Booking -->
  <rect x="350" y="70" width="150" height="60" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
  <text x="425" y="93" font-size="11" font-weight="bold" text-anchor="middle">Submit Ad Booking</text>
  <text x="425" y="108" font-size="10" text-anchor="middle">(status = SUBMITTED</text>
  <text x="425" y="121" font-size="10" text-anchor="middle">to Editorial Queue)</text>

  <!-- Arrow down to Lane 2 -->
  <line x1="425" y1="130" x2="425" y2="210" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow2)" />

  <!-- Box 3: Confirm Quotation & Sign Contract (Lane 1) -->
  <rect x="540" y="70" width="180" height="60" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
  <text x="630" y="93" font-size="11" font-weight="bold" text-anchor="middle">Accept Official Quote</text>
  <text x="630" y="108" font-size="10" text-anchor="middle">&amp; Sign Economic Contract</text>
  <text x="630" y="121" font-size="10" text-anchor="middle">(status = CONFIRMED)</text>

  <!-- Box 4: Upload Creative Banner (Lane 1) -->
  <rect x="760" y="70" width="160" height="60" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
  <text x="840" y="93" font-size="11" font-weight="bold" text-anchor="middle">Upload Banner Creative</text>
  <text x="840" y="108" font-size="10" text-anchor="middle">(asset file, target URL,</text>
  <text x="840" y="121" font-size="10" text-anchor="middle">spec dimensions)</text>

  <!-- Arrow Box 3 -> Box 4 -->
  <line x1="720" y1="100" x2="760" y2="100" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow2)" />

  <!-- ========================================== -->
  <!-- LANE 2: REVIEWER / STAFF                   -->
  <!-- ========================================== -->
  <!-- Box 5: Inventory & Conflict Engine -->
  <rect x="340" y="210" width="170" height="55" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
  <text x="425" y="233" font-size="11" font-weight="bold" text-anchor="middle">Check Slot Inventory</text>
  <text x="425" y="247" font-size="10" text-anchor="middle">&amp; Capacity Engine (Rule 7)</text>

  <!-- Arrow Box 5 -> Diamond 1 -->
  <line x1="425" y1="265" x2="425" y2="290" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow2)" />

  <!-- Diamond 1: Slot Available? -->
  <polygon points="425,290 460,315 425,340 390,315" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
  <text x="425" y="283" font-size="10" font-style="italic" text-anchor="middle">Slot Free?</text>

  <!-- Branch No -> Reject Booking -->
  <line x1="390" y1="315" x2="310" y2="315" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow2)" />
  <text x="360" y="307" font-size="10" font-weight="bold">No</text>

  <rect x="155" y="285" width="155" height="60" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
  <text x="232" y="308" font-size="11" font-weight="bold" text-anchor="middle">Reject Booking (REJECTED)</text>
  <text x="232" y="323" font-size="10" text-anchor="middle">(provide conflict reason</text>
  <text x="232" y="335" font-size="10" text-anchor="middle">&amp; alternative slot)</text>

  <!-- Branch Yes -> Send Quotation -->
  <line x1="460" y1="315" x2="540" y2="315" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow2)" />
  <text x="485" y="307" font-size="10" font-weight="bold">Yes</text>

  <rect x="540" y="285" width="180" height="60" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
  <text x="630" y="307" font-size="11" font-weight="bold" text-anchor="middle">Send Official Quotation</text>
  <text x="630" y="321" font-size="10" text-anchor="middle">(VIP tier discount %, final</text>
  <text x="630" y="334" font-size="10" text-anchor="middle">price &amp; SOV 100% note)</text>

  <!-- Arrow Quotation UP to Box 3 Confirm -->
  <line x1="630" y1="285" x2="630" y2="136" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow2)" />

  <!-- Arrow from Box 4 Upload down to Review Creative -->
  <line x1="840" y1="130" x2="840" y2="210" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow2)" />

  <!-- Box: Review Creative & Rule 8 -->
  <rect x="760" y="210" width="160" height="55" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
  <text x="840" y="233" font-size="11" font-weight="bold" text-anchor="middle">Review Creative Asset</text>
  <text x="840" y="247" font-size="10" text-anchor="middle">(Rule 8 Versioning)</text>

  <!-- Diamond 2: Creative Approved? -->
  <line x1="840" y1="265" x2="840" y2="290" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow2)" />
  <polygon points="840,290 875,315 840,340 805,315" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
  <text x="840" y="283" font-size="10" font-style="italic" text-anchor="middle">Approved?</text>

  <!-- No -> Back to upload banner -->
  <path d="M 875 315 L 940 315 L 940 100 L 926 100" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow2)" />
  <text x="888" y="307" font-size="10" font-weight="bold">No</text>

  <!-- Yes -> Gatekeeper 5 Conditions -->
  <line x1="840" y1="340" x2="840" y2="355" stroke="#000000" stroke-width="1.5" />
  <line x1="840" y1="355" x2="720" y2="355" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow2)" />
  <text x="845" y="350" font-size="10" font-weight="bold">Yes</text>

  <rect x="520" y="345" width="200" height="55" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
  <text x="620" y="367" font-size="11" font-weight="bold" text-anchor="middle">Gatekeeper Evaluation (Rule 9)</text>
  <text x="620" y="382" font-size="10" text-anchor="middle">(Payment + Quote + Contract + Creative + Slot)</text>

  <!-- Diamond 3: All 5 Passed? -->
  <line x1="520" y1="372" x2="480" y2="372" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow2)" />
  <polygon points="455,350 480,372 455,394 430,372" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
  <text x="455" y="343" font-size="10" font-style="italic" text-anchor="middle">5/5 Passed?</text>

  <!-- Yes -> Activate Campaign -->
  <line x1="430" y1="372" x2="310" y2="372" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow2)" />
  <text x="360" y="364" font-size="10" font-weight="bold">Yes (LIVE)</text>

  <rect x="155" y="350" width="155" height="45" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
  <text x="232" y="372" font-size="11" font-weight="bold" text-anchor="middle">Activate Campaign</text>
  <text x="232" y="386" font-size="10" text-anchor="middle">(Authorize Live Serving)</text>

  <!-- ========================================== -->
  <!-- LANE 3: SYSTEM / PLATFORM                  -->
  <!-- ========================================== -->
  <!-- Arrow from Activate down to Lane 3 -->
  <line x1="232" y1="395" x2="232" y2="450" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow2)" />

  <!-- Box 7: Update Status to ACTIVE -->
  <rect x="155" y="450" width="155" height="55" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
  <text x="232" y="473" font-size="11" font-weight="bold" text-anchor="middle">Update Status to ACTIVE</text>
  <text x="232" y="488" font-size="10" text-anchor="middle">&amp; Store Audit Log</text>

  <!-- Arrow Box 7 -> Box 8 Serve Banner -->
  <line x1="310" y1="477" x2="360" y2="477" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow2)" />

  <rect x="360" y="450" width="180" height="55" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
  <text x="450" y="473" font-size="11" font-weight="bold" text-anchor="middle">Serve Banner on Portal</text>
  <text x="450" y="488" font-size="10" text-anchor="middle">(Track views, clicks &amp; SOV)</text>

  <!-- Arrow Box 8 -> Box 9 Watchdog / Kill-Switch -->
  <line x1="540" y1="477" x2="590" y2="477" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow2)" />

  <rect x="590" y="450" width="180" height="55" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
  <text x="680" y="473" font-size="11" font-weight="bold" text-anchor="middle">Emergency Watchdog</text>
  <text x="680" y="488" font-size="10" text-anchor="middle">(Kill-Switch &amp; Make-Good)</text>

  <!-- Arrow Box 9 -> Box 10 Completion -->
  <line x1="770" y1="477" x2="820" y2="477" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow2)" />

  <rect x="820" y="450" width="110" height="55" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
  <text x="875" y="475" font-size="11" font-weight="bold" text-anchor="middle">Conclude &amp;</text>
  <text x="875" y="490" font-size="10" text-anchor="middle">Report KPI</text>

  <!-- Arrow Box 10 -> End Node -->
  <line x1="930" y1="477" x2="960" y2="477" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow2)" />

  <!-- End Node Bullseye -->
  <circle cx="972" cy="477" r="12" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
  <circle cx="972" cy="477" r="6" fill="#000000" />
</svg>