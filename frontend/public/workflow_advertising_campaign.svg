<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 670" width="1060" height="670" style="background:#ffffff; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Marker arrow for lines -->
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000" />
    </marker>
  </defs>

  <!-- Title & Subtitle Header -->
  <text x="530" y="30" font-size="16" font-weight="900" text-anchor="middle" letter-spacing="0.5">FLOW 2.2 — ADVERTISING CAMPAIGN OPERATIONS &amp; GATEKEEPER AUDIT</text>
  <text x="530" y="47" font-size="11" font-weight="normal" fill="#475569" text-anchor="middle">Booking intake (UC016) • Inventory (UC017) • Contracts &amp; VIP (UC019) • Gatekeeper appraisal (UC023) • Control (UC024)</text>

  <!-- Outer Frame -->
  <rect x="20" y="58" width="1020" height="595" fill="none" stroke="#000000" stroke-width="1.8" />

  <!-- Horizontal Swimlane Dividers (3 Lanes: Advertiser, Editor, System Platform) -->
  <line x1="20" y1="205" x2="1040" y2="205" stroke="#000000" stroke-width="1.2" />
  <line x1="20" y1="465" x2="1040" y2="465" stroke="#000000" stroke-width="1.2" />

  <!-- Vertical Lane Header Divider -->
  <line x1="85" y1="58" x2="85" y2="653" stroke="#000000" stroke-width="1.2" />

  <!-- Swimlane Left Headers (Vertical Text) -->
  <g font-size="12" font-weight="bold" fill="#000000" text-anchor="middle" letter-spacing="1">
    <text x="52" y="132" transform="rotate(-90 52 132)">ADVERTISER</text>
    <text x="52" y="335" transform="rotate(-90 52 335)">EDITOR</text>
    <text x="52" y="560" transform="rotate(-90 52 560)">SYSTEM PLATFORM</text>
  </g>

  <!-- ====================================================================== -->
  <!-- LANE 1: ADVERTISER (y: 58 - 205)                                       -->
  <!-- ====================================================================== -->

  <!-- Start Node -->
  <circle cx="115" cy="132" r="9" fill="#000000" />
  <line x1="124" y1="132" x2="148" y2="132" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow2)" />

  <!-- Box 1: Create Booking Request -->
  <rect x="150" y="109" width="145" height="46" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="222" y="129" font-size="10" font-weight="bold" text-anchor="middle">Create booking request</text>
  <text x="222" y="143" font-size="8.5" text-anchor="middle">(slotId, dateRange, contact)</text>

  <line x1="295" y1="132" x2="333" y2="132" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow2)" />

  <!-- Box 2: Submit Ad Booking -->
  <rect x="335" y="109" width="135" height="46" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="402" y="129" font-size="10" font-weight="bold" text-anchor="middle">Submit ad booking</text>
  <text x="402" y="143" font-size="8.5" text-anchor="middle">(status = SUBMITTED)</text>

  <!-- Arrow Box 2 down to Editor Lane Box 5 -->
  <line x1="402" y1="155" x2="402" y2="243" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow2)" />

  <!-- Box 3: Accept Quote & Sign Contract -->
  <rect x="520" y="109" width="165" height="46" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="602" y="129" font-size="9.5" font-weight="bold" text-anchor="middle">Accept quote &amp; contract</text>
  <text x="602" y="143" font-size="8.5" text-anchor="middle">(status = CONFIRMED)</text>

  <line x1="685" y1="132" x2="728" y2="132" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow2)" />

  <!-- Box 4: Upload Banner Creative -->
  <rect x="730" y="109" width="150" height="46" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="805" y="129" font-size="10" font-weight="bold" text-anchor="middle">Upload banner asset</text>
  <text x="805" y="143" font-size="8.5" text-anchor="middle">(image file, landing URL)</text>

  <!-- Arrow Box 4 down to Editor Lane Box 7 (Review Creative) -->
  <line x1="805" y1="155" x2="805" y2="243" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow2)" />

  <!-- ====================================================================== -->
  <!-- LANE 2: EDITOR (y: 205 - 465) - SV2 CORE OPERATIONS                    -->
  <!-- ====================================================================== -->

  <!-- Box 5: Check Slot Inventory (UC017) -->
  <rect x="325" y="245" width="155" height="46" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="402" y="265" font-size="9.5" font-weight="bold" text-anchor="middle">Inventory &amp; Slot check</text>
  <text x="402" y="279" font-size="8.5" text-anchor="middle">(UC017 - Rule 7 capacity)</text>

  <line x1="402" y1="291" x2="402" y2="318" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow2)" />

  <!-- Diamond 1: Slot Available? -->
  <polygon points="402,320 437,345 402,370 367,345" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="402" y="348" font-size="8.5" font-weight="bold" text-anchor="middle">Free?</text>

  <!-- Branch No -> Reject Booking (UC016) -->
  <line x1="367" y1="345" x2="248" y2="345" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow2)" />
  <text x="310" y="337" font-size="8.5" font-weight="bold" fill="#b91c1c">No</text>

  <!-- Box 6: Reject Booking (UC016) -->
  <rect x="110" y="322" width="135" height="46" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="177" y="342" font-size="9.5" font-weight="bold" text-anchor="middle">Reject booking (UC016)</text>
  <text x="177" y="356" font-size="8" text-anchor="middle">(provide conflict reason)</text>

  <!-- REJECT FLOW 1: Loop back UP to Advertiser (Revise dates/slot) -->
  <polyline points="145,322 145,80 222,80 222,107" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow2)" />
  <text x="183" y="74" font-size="8" font-weight="bold" fill="#b45309" text-anchor="middle">Revise dates / slot</text>

  <!-- REJECT FLOW 2: Straight line DOWN to System Box 6B (Cancel) -->
  <line x1="177" y1="368" x2="177" y2="498" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow2)" />
  <text x="185" y="420" font-size="8" font-weight="bold" fill="#b91c1c">Cancel</text>

  <!-- Branch Yes -> Send Official Quotation & Create Contract (UC019) -->
  <line x1="437" y1="345" x2="508" y2="345" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow2)" />
  <text x="470" y="337" font-size="8.5" font-weight="bold" fill="#15803d">Yes</text>

  <rect x="510" y="322" width="185" height="46" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="602" y="341" font-size="9.5" font-weight="bold" text-anchor="middle">Send quote &amp; Create contract</text>
  <text x="602" y="355" font-size="8" text-anchor="middle">(UC019: VIP tier discount &amp; PDF)</text>

  <!-- Arrow Quote UP to Advertiser Box 3 -->
  <line x1="602" y1="322" x2="602" y2="157" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow2)" />

  <!-- Box 7: Review Creative Asset (UC020/021 - Rule 8) -->
  <rect x="730" y="245" width="150" height="46" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="805" y="265" font-size="9.5" font-weight="bold" text-anchor="middle">Review creative (UC020)</text>
  <text x="805" y="279" font-size="8.5" text-anchor="middle">(Rule 8 Versioning)</text>

  <line x1="805" y1="291" x2="805" y2="318" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow2)" />

  <!-- Diamond 2: Creative Approved? -->
  <polygon points="805,320 845,345 805,370 765,345" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="805" y="348" font-size="8" font-weight="bold" text-anchor="middle">Approved?</text>

  <!-- Branch No -> Re-upload -->
  <polyline points="845,345 895,345 895,132 883,132" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow2)" />
  <text x="855" y="337" font-size="8.5" font-weight="bold" fill="#b91c1c">No</text>

  <!-- Branch Yes -> Broadcast Appraisal / Gatekeeper (UC023) -->
  <line x1="805" y1="370" x2="805" y2="388" stroke="#000000" stroke-width="1.2" />
  <polyline points="805,388 710,388 710,402" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow2)" />
  <text x="812" y="382" font-size="8.5" font-weight="bold" fill="#15803d">Yes</text>

  <!-- Box 8: Broadcast Appraisal (Gatekeeper 5-Door Audit - UC023 - Màn II.2.7) -->
  <rect x="580" y="405" width="240" height="46" fill="#fffbeb" stroke="#d97706" stroke-width="1.3" />
  <text x="700" y="422" font-size="9" font-weight="bold" fill="#92400e" text-anchor="middle">Broadcast Appraisal (UC023 Gatekeeper):</text>
  <text x="700" y="435" font-size="8" fill="#92400e" text-anchor="middle">1.Payment + 2.Quote + 3.Contract + 4.Creative + 5.Slot</text>
  <text x="700" y="446" font-size="7.5" fill="#b45309" text-anchor="middle">(Màn II.2.7 Thẩm định phát sóng)</text>

  <!-- Diamond 3: 5/5 Passed? -->
  <line x1="580" y1="428" x2="548" y2="428" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow2)" />
  <polygon points="525,409 548,428 525,447 502,428" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="525" y="431" font-size="7.5" font-weight="bold" text-anchor="middle">5/5?</text>

  <!-- Branch Yes -> Activate Campaign (UC023) -->
  <line x1="502" y1="428" x2="433" y2="428" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow2)" />
  <text x="465" y="420" font-size="8.5" font-weight="bold" fill="#15803d">Yes (Eligible)</text>

  <!-- Box 9: Authorize Campaign (LIVE) -->
  <rect x="280" y="405" width="150" height="46" fill="#ecfdf5" stroke="#059669" stroke-width="1.3" />
  <text x="355" y="423" font-size="9" font-weight="bold" fill="#065f46" text-anchor="middle">Authorize campaign activation</text>
  <text x="355" y="436" font-size="8" fill="#047857" text-anchor="middle">(Trigger "Activate LIVE" - UC023)</text>
  <text x="355" y="446" font-size="7.5" fill="#047857" text-anchor="middle">(Mở khóa khi đủ 5/5 cửa)</text>

  <!-- ====================================================================== -->
  <!-- LANE 3: SYSTEM PLATFORM (y: 465 - 653)                                 -->
  <!-- ====================================================================== -->

  <!-- Box 6B: Record Rejection in System (x=110..245) -->
  <rect x="110" y="500" width="135" height="48" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="177" y="520" font-size="9" font-weight="bold" text-anchor="middle">Set status REJECTED</text>
  <text x="177" y="534" font-size="8" text-anchor="middle">&amp; notify Advertiser</text>

  <!-- Rejection End Node Bullseye -->
  <circle cx="177" cy="585" r="9" fill="none" stroke="#000000" stroke-width="1.5" />
  <circle cx="177" cy="585" r="4.5" fill="#000000" />
  <line x1="177" y1="548" x2="177" y2="574" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow2)" />
  <text x="177" y="610" font-size="8" text-anchor="middle" fill="#64748b">Booking terminated</text>

  <!-- Arrow from Box 9 down to System Box 10 -->
  <line x1="355" y1="451" x2="355" y2="498" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow2)" />

  <!-- Box 10: Update status to ACTIVE -->
  <rect x="280" y="500" width="150" height="48" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="355" y="520" font-size="9.5" font-weight="bold" text-anchor="middle">Update status to ACTIVE</text>
  <text x="355" y="534" font-size="8.5" text-anchor="middle">&amp; record audit logs</text>

  <line x1="430" y1="524" x2="458" y2="524" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow2)" />

  <!-- Box 11: Serve Banner on Portal -->
  <rect x="460" y="500" width="160" height="48" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="540" y="520" font-size="9.5" font-weight="bold" text-anchor="middle">Serve banner on portal</text>
  <text x="540" y="534" font-size="8.5" text-anchor="middle">(Track views, clicks &amp; SOV)</text>

  <line x1="620" y1="524" x2="648" y2="524" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow2)" />

  <!-- Box 12: Emergency Watchdog & Campaign Control (UC024 - Màn II.2.8) -->
  <rect x="650" y="500" width="185" height="48" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="742" y="519" font-size="9" font-weight="bold" text-anchor="middle">Campaign Control (UC024)</text>
  <text x="742" y="532" font-size="8" text-anchor="middle">Emergency Kill-Switch (1s)</text>
  <text x="742" y="542" font-size="7.5" text-anchor="middle">&amp; Make-Good compensation</text>

  <line x1="835" y1="524" x2="858" y2="524" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow2)" />

  <!-- Box 13: Conclude & Report KPI -->
  <rect x="860" y="500" width="100" height="48" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="910" y="520" font-size="9" font-weight="bold" text-anchor="middle">Conclude &amp;</text>
  <text x="910" y="534" font-size="8" text-anchor="middle">report KPI</text>

  <!-- Arrow Box 13 to Bullseye End Node -->
  <circle cx="1000" cy="524" r="9" fill="none" stroke="#000000" stroke-width="1.5" />
  <circle cx="1000" cy="524" r="4.5" fill="#000000" />
  <line x1="960" y1="524" x2="989" y2="524" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow2)" />

</svg>
