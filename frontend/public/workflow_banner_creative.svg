<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="920" height="540" style="background:#ffffff; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Marker arrow -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000" />
    </marker>
  </defs>

  <!-- Outer frame -->
  <rect x="20" y="20" width="880" height="500" fill="none" stroke="#000000" stroke-width="2" />

  <!-- Horizontal Swimlane dividers -->
  <line x1="20" y1="180" x2="900" y2="180" stroke="#000000" stroke-width="1.5" />
  <line x1="20" y1="360" x2="900" y2="360" stroke="#000000" stroke-width="1.5" />

  <!-- Vertical Lane divider for titles -->
  <line x1="75" y1="20" x2="75" y2="520" stroke="#000000" stroke-width="1.5" />

  <!-- Swimlane Headers (Vertical Text) -->
  <g font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">
    <text x="47" y="100" transform="rotate(-90 47 100)">Advertiser</text>
    <text x="47" y="270" transform="rotate(-90 47 270)">Reviewer / Staff</text>
    <text x="47" y="440" transform="rotate(-90 47 440)">System / Platform</text>
  </g>

  <!-- ========================================== -->
  <!-- LANE 1: ADVERTISER                         -->
  <!-- ========================================== -->
  <!-- Start node: solid black circle -->
  <circle cx="120" cy="100" r="14" fill="#000000" />

  <!-- Arrow Start -> Box 1 -->
  <line x1="134" y1="100" x2="165" y2="100" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Box 1: Create Banner Creative -->
  <rect x="165" y="70" width="160" height="60" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
  <text x="245" y="94" font-size="11" font-weight="bold" text-anchor="middle">Create Banner Creative</text>
  <text x="245" y="110" font-size="10" text-anchor="middle">(asset, dimensions,</text>
  <text x="245" y="122" font-size="10" text-anchor="middle">landing page URL)</text>

  <!-- Arrow Box 1 -> Box 2 -->
  <line x1="325" y1="100" x2="360" y2="100" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Box 2: Submit Creative Version -->
  <rect x="360" y="70" width="160" height="60" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
  <text x="440" y="95" font-size="11" font-weight="bold" text-anchor="middle">Submit Creative Version</text>
  <text x="440" y="111" font-size="10" text-anchor="middle">(v1.0, SUBMITTED to</text>
  <text x="440" y="123" font-size="10" text-anchor="middle">Editorial Queue)</text>

  <!-- Box 3: Revise Creative Version -->
  <rect x="680" y="70" width="170" height="60" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
  <text x="765" y="95" font-size="11" font-weight="bold" text-anchor="middle">Revise Creative Version</text>
  <text x="765" y="111" font-size="10" text-anchor="middle">(adjust size, fix content,</text>
  <text x="765" y="123" font-size="10" text-anchor="middle">create new version v+1)</text>

  <!-- Arrow Box 3 -> Box 2 (loopback) -->
  <line x1="680" y1="100" x2="526" y2="100" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Arrow Box 2 down to Reviewer Lane -->
  <path d="M 440 130 L 440 220" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- ========================================== -->
  <!-- LANE 2: REVIEWER / STAFF                   -->
  <!-- ========================================== -->
  <!-- Box 4: Review Creative -->
  <rect x="360" y="220" width="160" height="60" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
  <text x="440" y="245" font-size="11" font-weight="bold" text-anchor="middle">Review Creative Asset</text>
  <text x="440" y="261" font-size="10" text-anchor="middle">(dimensions, safety,</text>
  <text x="440" y="273" font-size="10" text-anchor="middle">landing page &amp; copy)</text>

  <!-- Arrow Box 4 -> Decision Diamond -->
  <line x1="520" y1="250" x2="560" y2="250" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Decision Diamond: Approved? -->
  <polygon points="590,225 625,250 590,275 555,250" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
  <text x="590" y="217" font-size="10" font-style="italic" text-anchor="middle">Approved?</text>

  <!-- Arrow Diamond NO -> Provide Rejection Feedback -->
  <line x1="625" y1="250" x2="680" y2="250" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="645" y="242" font-size="10" font-weight="bold">No</text>

  <!-- Box 5: Provide Rejection Feedback -->
  <rect x="680" y="220" width="170" height="60" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
  <text x="765" y="245" font-size="11" font-weight="bold" text-anchor="middle">Provide Rejection</text>
  <text x="765" y="259" font-size="11" font-weight="bold" text-anchor="middle">Feedback</text>
  <text x="765" y="273" font-size="10" text-anchor="middle">(reason &amp; specs guide)</text>

  <!-- Arrow Feedback UP to Revise Creative -->
  <line x1="765" y1="220" x2="765" y2="136" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Arrow Diamond YES -> Approve Creative -->
  <line x1="590" y1="275" x2="590" y2="300" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="598" y="290" font-size="10" font-weight="bold">Yes</text>

  <!-- Box 6: Approve Creative Version -->
  <rect x="510" y="300" width="160" height="50" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
  <text x="590" y="321" font-size="11" font-weight="bold" text-anchor="middle">Approve Creative Version</text>
  <text x="590" y="337" font-size="10" text-anchor="middle">(status = APPROVED)</text>

  <!-- Arrow Box 6 -> Box 7 (Rule 8 switch) -->
  <line x1="670" y1="325" x2="700" y2="325" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Box 7: Rule 8 Serving Switch -->
  <rect x="700" y="300" width="150" height="50" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
  <text x="775" y="321" font-size="11" font-weight="bold" text-anchor="middle">Live Serving Switch</text>
  <text x="775" y="337" font-size="10" text-anchor="middle">(Rule 8: archive old v)</text>

  <!-- ========================================== -->
  <!-- LANE 3: SYSTEM / PLATFORM                  -->
  <!-- ========================================== -->
  <!-- Double Arrow from Box 6 & 7 down to System Lane -->
  <path d="M 590 350 L 590 410" fill="none" stroke="#000000" stroke-width="1.5" />
  <path d="M 775 350 L 775 390 L 590 390 L 590 410" fill="none" stroke="#000000" stroke-width="1.5" />
  <line x1="590" y1="390" x2="590" y2="410" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Box 8: Update Status & Store Asset -->
  <rect x="500" y="410" width="180" height="60" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
  <text x="590" y="433" font-size="11" font-weight="bold" text-anchor="middle">Update Creative Status</text>
  <text x="590" y="449" font-size="10" text-anchor="middle">to ACTIVE_SERVING &amp;</text>
  <text x="590" y="462" font-size="10" text-anchor="middle">Store Version Asset</text>

  <!-- Arrow Box 8 -> Box 9 -->
  <line x1="680" y1="440" x2="715" y2="440" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Box 9: Serve Banner on Target Slot -->
  <rect x="715" y="410" width="145" height="60" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
  <text x="787" y="433" font-size="11" font-weight="bold" text-anchor="middle">Serve Banner Live</text>
  <text x="787" y="449" font-size="10" text-anchor="middle">(Track impressions,</text>
  <text x="787" y="462" font-size="10" text-anchor="middle">clicks &amp; SOV rate)</text>

  <!-- Arrow Box 9 -> End Node -->
  <line x1="860" y1="440" x2="880" y2="440" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- End Node: circle with inner dot (bullseye) -->
  <circle cx="887" cy="440" r="12" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
  <circle cx="887" cy="440" r="6" fill="#000000" />
</svg>